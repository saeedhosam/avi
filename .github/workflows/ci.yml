name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node / web / api / packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: OpenAPI spec is current
        run: |
          pnpm --filter @avi/api openapi
          git diff --exit-code packages/contracts/openapi.json
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: node
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Create CI debug keystore
        run: |
          mkdir -p "$HOME/.config/.android"
          if [ ! -f "$HOME/.config/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.config/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Assemble debug
        working-directory: apps/android
        run: gradle :app:assembleDebug --no-daemon
      - name: Unit tests
        working-directory: apps/android
        run: gradle :app:testDebugUnitTest --no-daemon

