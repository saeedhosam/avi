name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "services/api/**"
      - "packages/**"
      - "infra/server/**"
      - "supabase/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  database:
    name: Supabase migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Snapshot schema before migrating
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db dump --linked --file "backup-${GITHUB_SHA}.sql"
      - name: Store pre-migration snapshot
        uses: actions/upload-artifact@v5
        with:
          name: schema-backup-${{ github.sha }}
          path: backup-${{ github.sha }}.sql
          retention-days: 90
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --yes --password "$SUPABASE_DB_PASSWORD"

  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    needs: database
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/avi_deploy
          chmod 600 ~/.ssh/avi_deploy
          ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Build API image
        run: docker build -f services/api/Dockerfile -t "avi-api:${GITHUB_SHA}" .

      - name: Build web image
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          AVI_API_BASE_URL: ${{ secrets.AVI_API_BASE_URL }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
        run: |
          docker build \
            -f apps/web/Dockerfile \
            -t "avi-web:${GITHUB_SHA}" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            --build-arg AVI_API_BASE_URL="$AVI_API_BASE_URL" \
            --build-arg NEXT_PUBLIC_VAPID_PUBLIC_KEY="$NEXT_PUBLIC_VAPID_PUBLIC_KEY" \
            .

      - name: Sync compose and Caddy config
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          scp -i ~/.ssh/avi_deploy infra/server/compose.yml infra/server/Caddyfile \
            "$HETZNER_USER@$HETZNER_HOST:/opt/avi/"

      - name: Write production env files
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          AERODATABOX_API_KEY: ${{ secrets.AERODATABOX_API_KEY }}
          AERODATABOX_API_HOST: ${{ secrets.AERODATABOX_API_HOST }}
          AVI_API_BASE_URL: ${{ secrets.AVI_API_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          BILLING_PROVIDER: ${{ secrets.BILLING_PROVIDER || 'manual' }}
          POLAR_API_KEY: ${{ secrets.POLAR_API_KEY }}
          POLAR_PRICE_PLUS: ${{ secrets.POLAR_PRICE_PLUS }}
          POLAR_PRICE_PRO: ${{ secrets.POLAR_PRICE_PRO }}
          POLAR_WEBHOOK_SECRET: ${{ secrets.POLAR_WEBHOOK_SECRET }}
          APP_ORIGIN: ${{ secrets.APP_ORIGIN || 'https://avi.codestep.org' }}
          APP_API_ORIGIN: ${{ secrets.APP_API_ORIGIN || 'https://api.codestep.org' }}
        run: |
          ssh -i ~/.ssh/avi_deploy "$HETZNER_USER@$HETZNER_HOST" 'umask 077; cat > /opt/avi/.env.production' <<EOF
          NODE_ENV=production
          HOST=0.0.0.0
          PORT=8080
          LOG_LEVEL=info
          CORS_ORIGINS=$APP_ORIGIN,https://app.2-31-110-53.sslip.io
          PUBLIC_WEB_URL=$APP_ORIGIN
          AERODATABOX_API_KEY=$AERODATABOX_API_KEY
          AERODATABOX_API_HOST=$AERODATABOX_API_HOST
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_SECRET_KEY=$SUPABASE_SECRET_KEY
          REDIS_URL=redis://redis:6379
          # Web Push delivery (engine); leave empty to disable until keys exist.
          VAPID_PUBLIC_KEY=$VAPID_PUBLIC_KEY
          VAPID_PRIVATE_KEY=$VAPID_PRIVATE_KEY
          VAPID_SUBJECT=$VAPID_SUBJECT
          # Billing (Polar.sh MoR; unset = manual plan assignment).
          BILLING_PROVIDER=$BILLING_PROVIDER
          POLAR_API_KEY=$POLAR_API_KEY
          POLAR_PRICE_PLUS=$POLAR_PRICE_PLUS
          POLAR_PRICE_PRO=$POLAR_PRICE_PRO
          POLAR_WEBHOOK_SECRET=$POLAR_WEBHOOK_SECRET
          EOF

          ssh -i ~/.ssh/avi_deploy "$HETZNER_USER@$HETZNER_HOST" 'umask 077; cat > /opt/avi/.env.web.production' <<EOF
          NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
          AVI_API_BASE_URL=$AVI_API_BASE_URL
          AERODATABOX_API_KEY=$AERODATABOX_API_KEY
          AERODATABOX_API_HOST=$AERODATABOX_API_HOST
          NEXT_PUBLIC_VAPID_PUBLIC_KEY=$NEXT_PUBLIC_VAPID_PUBLIC_KEY
          EOF

      - name: Transfer images
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          docker save "avi-api:${GITHUB_SHA}" "avi-web:${GITHUB_SHA}" \
            | gzip -1 \
            | ssh -i ~/.ssh/avi_deploy "$HETZNER_USER@$HETZNER_HOST" "gunzip | docker load"

      - name: Activate release
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          ssh -i ~/.ssh/avi_deploy "$HETZNER_USER@$HETZNER_HOST" \
            "cd /opt/avi && \
             docker tag avi-api:${GITHUB_SHA} avi-api:previous || true; \
             docker tag avi-web:${GITHUB_SHA} avi-web:previous || true; \
             docker tag avi-api:local avi-api:previous 2>/dev/null || true; \
             docker tag avi-web:local avi-web:previous 2>/dev/null || true; \
             docker tag avi-api:${GITHUB_SHA} avi-api:local && \
             docker tag avi-web:${GITHUB_SHA} avi-web:local && \
             docker compose --env-file .env.web.production up -d --no-build && \
             docker compose restart caddy && \
             docker image prune -f && \
             docker compose ps"

      - name: Verify
        env:
          APP_API_URL: https://api.codestep.org
          APP_WEB_URL: https://avi.codestep.org
        run: |
          curl -fsS "$APP_API_URL/healthz"
          echo
          curl -fsS "$APP_API_URL/v1/status" | grep -o '"watchEngine":{[^}]*}' || true
          curl -fsS -o /dev/null "$APP_WEB_URL/"
